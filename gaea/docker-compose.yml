version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: gaea_postgres
    environment:
      POSTGRES_DB: video_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/init_database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gaea_network

  # 应用服务（前后端一体）
  app:
    build:
      context: ..
      dockerfile: gaea/Dockerfile
    container_name: gaea_app
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/video_analysis
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?请设置 SECRET_KEY 环境变量}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - TINGWU_APP_ID=${TINGWU_APP_ID:-}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
    volumes:
      - app_temp:/app/backend/temp
    ports:
      - "80:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gaea_network

volumes:
  postgres_data:
  app_temp:

networks:
  gaea_network:
    driver: bridge
